name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            exe: ockit-windows-amd64.exe
            py-arch: x64
          - os: macos-latest
            target: macos-arm64
            exe: ockit-macos-arm64
          - os: macos-13
            target: macos-x64
            exe: ockit-macos-x64
          - os: ubuntu-latest
            target: linux-amd64
            exe: ockit-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build binary
        run: pyinstaller --onefile --clean --name ockit-${{ matrix.target }} ockit.py

      - name: Smoke test
        run: dist/ockit-${{ matrix.target }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ockit-${{ matrix.target }}
          path: dist/ockit-${{ matrix.target }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ockit-*
